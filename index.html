<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fruit salad app</title>
    <script src="./script.js" defer></script>
</head>
<body text="pink">
    <header>
        <h1>fruit salad app</h1>
        <p>enter a fruit name below to get its nutritional information</p>
    </header>
    <section id="inputSection">
        <form>
            <label for="fruitInput">enter fruit name</label>
            <input type="text" id="fruitInput" name="fruit" placeholder="e.g. cherries" pattern="[a-zA-Z\s]+" required>
            <input type="submit" value="submit">
        </form>
    </section>
    
    <section id="fruitSection">
        <ul></ul>
    </section>

    <section id="nutritionSection">
        <p></p>
    </section>

    <section>
        <form id="create-fruit">
            <label for="fruitCreate">add a fruit</label>
            <input type="text" id="fruitCreate" name="fruit" placeholder="e.g. starfruit" required>
            <input type="submit" value="create">
        </form>
        <p id="message"></p>
    </section>

    <section>
        <form id="update-fruit">
            <input name="fruitName" placeholder="Existing fruit" required>
            <input name="newCalories" type="number"
                placeholder="New calories" min="0" step="any">
            <button type="submit">update</button>
        </form>
    </section>

    <section>
        <form id="delete-fruit">
            <label for="fruitDelete">delete a fruit</label>
            <input type="text" id="fruitDelete" name="fruit" placeholder="e.g. starfruit" required>
            <input type="submit" value="delete">
        </form>
        <p id="deleteMessage"></p>
    </section>

    <footer>
        <img style="width: 100%; position: absolute; bottom: 0;" src="https://img.magnific.com/premium-photo/different-fruits-isolated-white-background-with-copy-space_88281-2246.jpg?w=1380">
    </footer>
</body>
</html>
